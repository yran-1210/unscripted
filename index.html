
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unscripted Type Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=EB+Garamond:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;700;900&family=Libre+Baskerville:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700;900&family=Raleway:wght@300;700;900&family=Roboto:wght@400;700;900&family=Source+Sans+3:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --ui: #272729;
  --ui-dark: #1e1e20;
  --ui-line: #3b3b3e;
  --text: #ededee;
  --muted: #96969a;
  --accent: #79b4ff;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  background: #09090b;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.desktop {
  position: fixed;
  inset: 0;
  pointer-events: none;
  user-select: none;
  background:
    radial-gradient(ellipse at 70% 30%, #323039, transparent 42%),
    radial-gradient(ellipse at 20% 75%, #1a2530, transparent 45%),
    #08090b;
}

.os-menu {
  height: 28px;
  background: #08080acc;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  font-size: 12px;
}

.os-menu span {
  margin-right: 20px;
}

.desktop-files {
  position: absolute;
  right: 25px;
  top: 65px;
  display: grid;
  gap: 25px;
  text-align: center;
  font-size: 11px;
}

.desktop-file {
  width: 76px;
}

.file-icon {
  width: 45px;
  height: 48px;
  margin: 0 auto 7px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: #363747;
  border: 1px solid #ffffff22;
  font-size: 23px;
}

.dock {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  padding: 8px 10px;
  border: 1px solid #ffffff22;
  border-radius: 17px;
  background: #ffffff20;
  backdrop-filter: blur(15px);
}

.dock span {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #444653;
  color: white;
  font-size: 18px;
}

.dock span:nth-child(1) { background: #258fd6; }
.dock span:nth-child(2) { background: #d9dadf; color: #333; }
.dock span:nth-child(3) { background: #6254bb; }
.dock span:nth-child(4) { background: #32ae67; }
.dock span:nth-child(5) { background: #df514b; }
.dock span:nth-child(6) { background: #a36dd3; }

.window {
  position: absolute;
  z-index: 2;
  left: 4%;
  top: 6%;
  width: 92%;
  height: 85%;
  min-height: 520px;
  display: flex;
  flex-direction: column;
  background: var(--ui);
  border: 1px solid #55545a;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 25px 85px #000b;
}

.titlebar {
  height: 48px;
  flex: 0 0 48px;
  display: grid;
  grid-template-columns: 110px 1fr 110px;
  align-items: center;
  padding: 0 15px;
  background: linear-gradient(#414143, #313134);
  border-bottom: 1px solid #1a1a1c;
}

.traffic {
  display: flex;
  gap: 8px;
}

.traffic span {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.traffic span:nth-child(1) { background: #f36b67; }
.traffic span:nth-child(2) { background: #ecc34f; }
.traffic span:nth-child(3) { background: #4ac66c; }

.window-title {
  text-align: center;
  font-size: 13px;
  font-weight: 650;
}

.window-tools {
  justify-self: end;
  display: flex;
  gap: 6px;
}

.icon-button {
  width: 34px;
  height: 32px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  color: #c6c6c9;
}

.icon-button:hover,
.icon-button.active {
  background: #ffffff1b;
  border-color: #ffffff15;
  color: white;
}

.icon-button svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.workbench {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}

.workbench.has-library {
  grid-template-columns: 260px minmax(0, 1fr);
}

.workbench.has-transform {
  grid-template-columns: minmax(0, 1fr) 270px;
}

.workbench.has-library.has-transform {
  grid-template-columns: 260px minmax(0, 1fr) 270px;
}

.sidebar {
  min-height: 0;
  overflow: auto;
  background: #252527;
  scrollbar-width: thin;
  scrollbar-color: #505054 transparent;
}

.sidebar.left {
  display: none;
  border-right: 1px solid #111;
}

.sidebar.right {
  display: none;
  border-left: 1px solid #111;
}

.has-library .sidebar.left {
  display: block;
}

.has-transform .sidebar.right {
  display: block;
}

.panel-header {
  height: 46px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;
  border-bottom: 1px solid #414144;
  font-size: 12px;
  font-weight: 600;
}

.panel-actions {
  display: flex;
  gap: 6px;
}

.small-button {
  padding: 6px 9px;
  background: #353538;
  border: 1px solid #505054;
  border-radius: 4px;
  color: #bbb;
  font-size: 11px;
}

.small-button.active {
  background: #53637b;
  border-color: #7087a6;
  color: white;
}

.small-button:hover {
  color: white;
}

.font-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 34px;
  align-items: center;
  margin: 3px 7px;
  border-radius: 5px;
}

.font-row.active {
  background: #464d59;
}

.font-row:hover {
  background: #3a3b40;
}

.font-select {
  width: 100%;
  min-width: 0;
  padding: 10px;
  background: transparent;
  border: 0;
  color: #d6d6d8;
  font-size: 12px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pool-check {
  width: 15px;
  height: 15px;
  accent-color: #86b8fb;
  cursor: pointer;
}

.pool-check:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.category-list {
  padding: 10px 7px;
  border-top: 1px solid #414144;
}

.category-button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin: 2px 0;
  padding: 10px 11px;
  background: transparent;
  border: 0;
  border-radius: 4px;
  color: #c9c9cb;
  font-size: 12px;
  text-align: left;
}

.category-button.active,
.category-button:hover {
  background: #404146;
  color: white;
}

.category-button small {
  color: #999;
}

.workarea {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #08090a;
}

.workarea-toolbar {
  height: 36px;
  flex: 0 0 36px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid #29292c;
  background: #202022;
}

.workarea-toolbar:has(#back-button[hidden]) {
  border-bottom-color: transparent;
}

#back-button[hidden] {
  display: none;
}

.back-button {
  padding: 5px 10px;
  background: transparent;
  border: 0;
  color: #ddd;
  font-size: 17px;
}

.back-button:hover {
  color: white;
}

.canvas {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: #08090a;
}

#ambient {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#compose-view,
#glyph-view,
#edit-view {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: none;
}

#compose-view.active {
  display: flex;
  flex-direction: column;
  padding: 38px;
}

#composition {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  align-items: baseline;
  min-height: 70px;
  max-height: 75%;
  overflow: auto;
  scrollbar-width: thin;
}

.unit {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: baseline;
  justify-content: center;
  height: 1.65em;
  cursor: pointer;
  border-radius: 3px;
}

.unit:hover {
  background: #ffffff15;
}

.unit .shape {
  display: inline-block;
  transform-origin: 50% 75%;
  white-space: pre;
  line-height: 1.05;
  user-select: none;
}

.unit.space {
  cursor: default;
}

.unit.break {
  flex-basis: 100%;
  height: .3em;
}

.input-wrap {
  margin-top: auto;
}

#type-input {
  display: block;
  width: min(520px, 100%);
  height: 48px;
  padding: 12px 15px;
  background: #1b1c1e;
  border: 1px solid #545458;
  border-radius: 4px;
  color: white;
  resize: none;
  outline: none;
  font-size: 13px;
}

#type-input::placeholder {
  color: #777;
}

#type-input:focus {
  border-color: #9a9da6;
}

#glyph-view.active {
  display: flex;
  flex-direction: column;
  background: #0d0d0f;
}

.glyph-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid #303033;
}

.glyph-header h2 {
  font-size: 17px;
  font-weight: 450;
  margin: 0;
}

.glyph-header span {
  font-size: 11px;
  color: #999;
}

#glyph-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  grid-auto-rows: 110px;
  align-content: start;
  overflow: auto;
}

.glyph-cell {
  position: relative;
  display: grid;
  place-items: center;
  background: #111113;
  border: 0;
  border-right: 1px solid #303034;
  border-bottom: 1px solid #303034;
  color: #eee;
  overflow: hidden;
}

.glyph-cell:hover {
  background: #373b44;
}

.glyph-cell .letter {
  display: block;
  line-height: 1;
  transform-origin: center;
  white-space: nowrap;
}

.glyph-cell small {
  position: absolute;
  left: 9px;
  bottom: 7px;
  font-size: 10px;
  color: #929297;
  font-family: "IBM Plex Mono", monospace;
}

#edit-view.active {
  display: flex;
  flex-direction: column;
  background: #f8f8f8;
  color: #171717;
}

.edit-toolbar {
  height: 42px;
  flex: 0 0 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 17px;
  background: #e8e8e8;
  border-bottom: 1px solid #c9c9c9;
}

.edit-toolbar span {
  font-size: 12px;
}

.edit-actions {
  display: flex;
  gap: 8px;
}

.edit-actions button {
  border: 1px solid #c6c6c6;
  border-radius: 4px;
  background: white;
  color: #333;
  padding: 6px 12px;
  font-size: 11px;
}

.edit-board {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: #fafafa;
}

.edit-guides {
  position: relative;
  width: 290px;
  height: 360px;
  border-left: 1px solid #e4c5a7;
  border-right: 1px solid #e4c5a7;
  user-select: none;
}

.guide {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: #dfbb9a;
  opacity: .85;
}

.guide.ascender { top: 8%; }
.guide.cap { top: 20%; }
.guide.xheight { top: 43%; }
.guide.baseline { top: 80%; }
.guide.descender { top: 94%; }

.edit-letter {
  position: absolute;
  left: 50%;
  top: 51%;
  line-height: 1;
  white-space: pre;
  transform-origin: center;
  color: #2d2d2d;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.edit-letter:active {
  cursor: grabbing;
}

.edit-footer {
  height: 40px;
  flex: 0 0 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  background: #e5e5e5;
  border-top: 1px solid #ccc;
  color: #666;
  font: 11px "IBM Plex Mono", monospace;
}

.metric {
  padding: 13px 16px;
  border-bottom: 1px solid #343438;
}

.metric-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 13px;
  gap: 12px;
  font-size: 11px;
  color: #d4d4d6;
}

.number-field {
  display: flex;
  align-items: center;
  background: #3a3a3d;
  border: 1px solid #55555a;
  border-radius: 4px;
  padding: 0 5px;
}

.number-field input {
  width: 51px;
  padding: 5px 2px;
  background: transparent;
  border: 0;
  outline: none;
  color: #eee;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  text-align: right;
  appearance: textfield;
}

.number-field input::-webkit-inner-spin-button,
.number-field input::-webkit-outer-spin-button {
  appearance: none;
  margin: 0;
}

.number-field span {
  font-size: 10px;
  color: #999;
  margin-left: 2px;
}

.metric input[type="range"] {
  width: 100%;
  appearance: none;
  background: #57575b;
  height: 3px;
  border-radius: 3px;
  cursor: pointer;
}

.metric input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 13px;
  height: 13px;
  background: #c6c6ca;
  border: 1px solid #333;
  border-radius: 50%;
}

.metric input[type="range"]::-moz-range-thumb {
  width: 13px;
  height: 13px;
  background: #c6c6ca;
  border: 1px solid #333;
  border-radius: 50%;
}

.action-button {
  display: block;
  margin: 16px;
  padding: 10px;
  width: calc(100% - 32px);
  background: #393a3f;
  border: 1px solid #58595e;
  border-radius: 4px;
  color: #ddd;
  font-size: 11px;
}

.action-button:hover {
  background: #4b4d54;
}

@media(max-width: 1050px) {
  .workbench.has-library {
    grid-template-columns: 200px minmax(0,1fr);
  }

  .workbench.has-transform {
    grid-template-columns: minmax(0,1fr) 220px;
  }

  .workbench.has-library.has-transform {
    grid-template-columns: 200px minmax(0,1fr) 220px;
  }
}

@media(max-width: 750px) {
  .window {
    left: 2%;
    top: 4%;
    width: 96%;
    height: 91%;
    min-height: 0;
  }

  .workbench,
  .workbench.has-library,
  .workbench.has-transform,
  .workbench.has-library.has-transform {
    position: relative;
    grid-template-columns: minmax(0,1fr);
  }

  .sidebar.left,
  .sidebar.right {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 5;
    width: min(260px,80vw);
    box-shadow: 0 8px 25px #0009;
  }

  .sidebar.left { left: 0; }
  .sidebar.right { right: 0; }

  #compose-view.active {
    padding: 24px;
  }

  .edit-guides {
    width: 200px;
    height: 300px;
  }

  .desktop-files {
    display: none;
  }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="desktop" aria-hidden="true">
  <div class="os-menu">
    <div>
      <span>●</span>
      <span><strong>Unscripted</strong></span>
      <span>File</span>
      <span>Edit</span>
      <span>Glyph</span>
      <span>View</span>
    </div>
    <div>◈ &nbsp; ◉ &nbsp; ▰</div>
  </div>

  <div class="desktop-files">
    <div class="desktop-file">
      <div class="file-icon">Aa</div>
      Type Lab
    </div>
    <div class="desktop-file">
      <div class="file-icon">▤</div>
      References
    </div>
  </div>

  <div class="dock">
    <span>◑</span><span>◉</span><span>✧</span>
    <span>✉</span><span>♫</span><span>✿</span>
  </div>
</div>

<section class="window" aria-label="Unscripted Type Lab">
  <header class="titlebar">
    <div class="traffic">
      <span></span><span></span><span></span>
    </div>

    <div class="window-title">Unscripted</div>

    <div class="window-tools">
      <button
        id="library-toggle"
        class="icon-button"
        type="button"
        title="Typefaces"
        aria-label="Toggle typeface library"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M9 4v16"/>
          <path d="M5 8h2M5 12h2M5 16h2"/>
        </svg>
      </button>

      <button
        id="transform-toggle"
        class="icon-button"
        type="button"
        title="Transformations"
        aria-label="Toggle transformations"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16M4 17h16"/>
          <circle cx="9" cy="7" r="3" fill="#38383a"/>
          <circle cx="16" cy="17" r="3" fill="#38383a"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="workbench" id="workbench">

    <aside class="sidebar left" id="library-panel">
      <div class="panel-header">
        <span>Fonts</span>
        <div class="panel-actions">
          <button id="mix-button" class="small-button active" type="button">Mix</button>
          <button id="all-fonts-button" class="small-button" type="button">All</button>
        </div>
      </div>

      <div id="font-list"></div>

      <div class="category-list">
        <button class="category-button active" data-category="upper" type="button">
          Uppercase <small>26</small>
        </button>

        <button class="category-button" data-category="lower" type="button">
          Lowercase <small>26</small>
        </button>

        <button class="category-button" data-category="digit" type="button">
          Numbers <small>10</small>
        </button>

        <button class="category-button" data-category="punct" type="button">
          Punctuation <small>32</small>
        </button>
      </div>
    </aside>

    <div class="workarea">
      <div class="workarea-toolbar">
        <button id="back-button" class="back-button" type="button" title="Back" hidden>←</button>
      </div>

      <div class="canvas" id="canvas">
        <canvas id="ambient" aria-hidden="true"></canvas>

        <div id="compose-view" class="active">
          <div id="composition" aria-label="Typography composition"></div>

          <div class="input-wrap">
            <textarea
              id="type-input"
              rows="1"
              placeholder="Type something..."
              aria-label="Type something"
              spellcheck="false"
              autocorrect="off"
              autocomplete="off"
              autocapitalize="off"
            ></textarea>
          </div>
        </div>

        <div id="glyph-view">
          <div class="glyph-header">
            <h2 id="glyph-heading"></h2>
            <span id="glyph-category"></span>
          </div>
          <div id="glyph-grid"></div>
        </div>

        <div id="edit-view">
          <div class="edit-toolbar">
            <span id="edit-heading"></span>
            <div class="edit-actions">
              <button id="insert-glyph" type="button">Insert</button>
              <button id="back-edit" type="button">Back</button>
            </div>
          </div>

          <div class="edit-board">
            <div class="edit-guides" id="edit-guides">
              <div class="guide ascender"></div>
              <div class="guide cap"></div>
              <div class="guide xheight"></div>
              <div class="guide baseline"></div>
              <div class="guide descender"></div>
              <span class="edit-letter" id="edit-letter"></span>
            </div>
          </div>

          <div class="edit-footer">
            <span id="edit-unicode"></span>
            <span id="edit-font-name"></span>
          </div>
        </div>
      </div>
    </div>

    <aside class="sidebar right" id="transform-panel">
      <div class="panel-header">Transformations</div>
      <div id="metrics"></div>
      <button id="reset-button" class="action-button" type="button">Reset</button>
    </aside>

  </div>
</section>

<script>
const fonts = [
  {name:"Aptos",family:'"Aptos","Inter",Arial,sans-serif'},
  {name:"Arial",family:'"Arial","Roboto",sans-serif'},
  {name:"Times New Roman",family:'"Times New Roman","Libre Baskerville",serif'},
  {name:"Georgia",family:'"Georgia","Merriweather",serif'},
  {name:"Garamond",family:'"Garamond","EB Garamond",serif'},
  {name:"Helvetica Neue",family:'"Helvetica Neue","Raleway",sans-serif'},
  {name:"Futura",family:'"Futura","Montserrat",sans-serif'},
  {name:"Myriad Pro",family:'"Myriad Pro","Source Sans 3",sans-serif'},
  {name:"Minion Pro",family:'"Minion Pro","Crimson Pro",serif'},
  {name:"Courier New",family:'"Courier New","IBM Plex Mono",monospace'}
];

const groups = {
  upper:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",
  lower:"abcdefghijklmnopqrstuvwxyz",
  digit:"0123456789",
  punct:"!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
};

const groupNames = {
  upper:"Uppercase",
  lower:"Lowercase",
  digit:"Numbers",
  punct:"Punctuation"
};

const defaults = {
  size:28,
  width:100,
  height:100,
  rotate:0,
  x:0,
  y:0,
  tracking:0,
  weight:400
};

const definitions = [
  ["size","Size",8,140,1,"px"],
  ["width","Width",40,200,1,"%"],
  ["height","Height",40,200,1,"%"],
  ["rotate","Rotation",-45,45,1,"°"],
  ["x","Offset X",-100,100,1,"px"],
  ["y","Offset Y",-100,100,1,"px"],
  ["tracking","Tracking",-10,30,1,"px"],
  ["weight","Weight",300,900,100,""]
];

const state = {
  mode:"compose",
  previousMode:"compose",
  fontMode:"mix",
  focusFont:0,
  pool:new Set(fonts.map((_,i)=>i)),
  category:"upper",
  text:"",
  displayText:"",
  glyphs:[],
  editGlyph:null,
  selectedIndex:null,
  global:{...defaults}
};

const $ = id => document.getElementById(id);
const pick = array => array[Math.floor(Math.random()*array.length)];
const rand = (a,b) => a+Math.random()*(b-a);
const clamp = (value,min,max) => Math.max(min,Math.min(max,value));

const measuringContext = document.createElement("canvas").getContext("2d");

function currentPool(){
  return state.fontMode==="mix"
    ? Array.from(state.pool)
    : [state.focusFont];
}

function createGlyph(char,fontIndex=null){
  return {
    char,
    fontIndex:fontIndex===null?pick(currentPool()):fontIndex,
    sx:rand(.84,1.16),
    sy:rand(.85,1.18),
    tilt:rand(-4,4),
    scale:rand(.9,1.12),
    dx:0,
    dy:0
  };
}

function buildFontList(){
  const list=$("font-list");
  list.replaceChildren();

  fonts.forEach((font,index)=>{
    const row=document.createElement("div");
    row.className="font-row";

    if(state.focusFont===index && state.fontMode==="single"){
      row.classList.add("active");
    }

    const button=document.createElement("button");
    button.type="button";
    button.className="font-select";
    button.textContent=
      String(index+1).padStart(2,"0")+"  "+font.name;

    button.addEventListener("click",()=>{
      state.focusFont=index;
      state.fontMode="single";
      state.category="upper";
      regenerate(true);
      renderComposition();
      buildFontList();
      renderGlyphGrid();
      switchMode("glyph");
    });

    const checkbox=document.createElement("input");
    checkbox.type="checkbox";
    checkbox.className="pool-check";
    checkbox.checked=state.pool.has(index);
    checkbox.disabled=checkbox.checked&&state.pool.size===1;
    checkbox.setAttribute("aria-label","Include "+font.name);

    checkbox.addEventListener("change",()=>{
      if(checkbox.checked){
        state.pool.add(index);
      }else{
        if(state.pool.size===1){
          checkbox.checked=true;
          return;
        }
        state.pool.delete(index);
      }

      state.fontMode="mix";
      regenerate(true);
      buildFontList();
      renderComposition();

      if(state.mode==="glyph"){
        renderGlyphGrid();
      }

      syncMixButton();
    });

    row.append(button,checkbox);
    list.appendChild(row);
  });

  syncMixButton();
}

function syncMixButton(){
  $("mix-button").classList.toggle(
    "active",
    state.fontMode==="mix"
  );
  $("mix-button").setAttribute(
    "aria-pressed",
    String(state.fontMode==="mix")
  );
}

function regenerate(force=false){
  const next=Array.from(state.text||"Hello World");
  const oldText=Array.from(state.displayText);
  const oldGlyphs=state.glyphs;

  let prefix=0;
  let suffix=0;

  if(!force){
    while(
      prefix<oldText.length&&
      prefix<next.length&&
      oldText[prefix]===next[prefix]
    ){
      prefix++;
    }

    while(
      suffix<oldText.length-prefix&&
      suffix<next.length-prefix&&
      oldText[oldText.length-1-suffix]===next[next.length-1-suffix]
    ){
      suffix++;
    }
  }

  const start=oldGlyphs.slice(0,prefix);
  const end=suffix?oldGlyphs.slice(-suffix):[];

  const middle=next
    .slice(prefix,next.length-suffix)
    .map(char=>createGlyph(char));

  state.glyphs=[...start,...middle,...end];
  state.displayText=next.join("");
}

function renderComposition(){
  const container=$("composition");
  container.replaceChildren();

  const fragment=document.createDocumentFragment();
  const t=state.global;

  state.glyphs.forEach((glyph,index)=>{
    const unit=document.createElement("span");
    unit.className="unit";

    if(glyph.char==="\n"){
      unit.classList.add("break");
      fragment.appendChild(unit);
      return;
    }

    if(/\s/u.test(glyph.char)){
      unit.classList.add("space");
      unit.style.width=t.size*.38+"px";
      fragment.appendChild(unit);
      return;
    }

    const font=fonts[glyph.fontIndex];
    const shape=document.createElement("span");

    const size=t.size*glyph.scale;
    const sx=t.width/100*glyph.sx;
    const sy=t.height/100*glyph.sy;

    shape.className="shape";
    shape.textContent=glyph.char;
    shape.style.fontFamily=font.family;
    shape.style.fontWeight=t.weight;
    shape.style.fontSize=size+"px";

    shape.style.transform=
      `translate(${t.x+glyph.dx}px,${t.y+glyph.dy}px) `+
      `rotate(${t.rotate+glyph.tilt}deg) `+
      `scale(${sx},${sy})`;

    measuringContext.font=
      `${t.weight} ${size}px ${font.family}`;

    const width=measuringContext.measureText(glyph.char).width*sx;

    unit.style.width=Math.max(5,width+t.tracking+2)+"px";
    unit.style.height=Math.max(18,t.size*1.65)+"px";

    unit.appendChild(shape);

    unit.addEventListener("click",()=>{
      openEditor(glyph,index);
    });

    fragment.appendChild(unit);
  });

  container.appendChild(fragment);
}

function renderGlyphGrid(){
  const grid=$("glyph-grid");
  grid.replaceChildren();

  const font=fonts[state.focusFont];
  const chars=Array.from(groups[state.category]);
  const t=state.global;

  $("glyph-heading").textContent=font.name;
  $("glyph-category").textContent=groupNames[state.category];

  chars.forEach(char=>{
    const cell=document.createElement("button");
    cell.type="button";
    cell.className="glyph-cell";

    const letter=document.createElement("span");
    letter.className="letter";
    letter.textContent=char;
    letter.style.fontFamily=font.family;
    letter.style.fontWeight=t.weight;
    letter.style.fontSize=Math.max(28,t.size*1.8)+"px";

    letter.style.transform=
      `translate(${t.x}px,${t.y}px) `+
      `rotate(${t.rotate}deg) `+
      `scale(${t.width/100},${t.height/100})`;

    const label=document.createElement("small");
    label.textContent=char;

    cell.append(letter,label);

    cell.addEventListener("click",()=>{
      openEditor(createGlyph(char,state.focusFont),null);
    });

    grid.appendChild(cell);
  });
}

function switchMode(mode){
  state.mode=mode;

  ["compose","glyph","edit"].forEach(name=>{
    $(name+"-view").classList.toggle("active",name===mode);
  });

  $("back-button").hidden=mode==="compose";

  if(mode==="glyph"){
    renderGlyphGrid();
  }

  if(mode==="edit"){
    renderEditor();
  }
}

function openEditor(glyph,index){
  state.previousMode=state.mode;
  state.editGlyph=glyph;
  state.selectedIndex=index;
  switchMode("edit");
}

function renderEditor(){
  const glyph=state.editGlyph;
  if(!glyph)return;

  const t=state.global;
  const font=fonts[glyph.fontIndex];
  const letter=$("edit-letter");
  const guides=$("edit-guides");

  const displaySize=Math.max(55,Math.min(390,t.size*6));

  letter.textContent=glyph.char;
  letter.style.fontFamily=font.family;
  letter.style.fontWeight=t.weight;
  letter.style.fontSize=displaySize*glyph.scale+"px";

  letter.style.transform=
    `translate(-50%,-50%) `+
    `translate(${t.x+glyph.dx}px,${t.y+glyph.dy}px) `+
    `rotate(${t.rotate+glyph.tilt}deg) `+
    `scale(${t.width/100*glyph.sx},${t.height/100*glyph.sy})`;

  guides.style.width=
    Math.max(170,Math.min(450,displaySize*1.4*t.width/100))+"px";

  guides.style.height=
    Math.max(250,Math.min(500,displaySize*1.8*t.height/100))+"px";

  $("edit-heading").textContent=glyph.char;
  $("edit-font-name").textContent=font.name;

  $("edit-unicode").textContent=
    "U+"+glyph.char.codePointAt(0)
      .toString(16).toUpperCase().padStart(4,"0");
}

function renderAll(){
  renderComposition();

  if(state.mode==="glyph"){
    renderGlyphGrid();
  }

  if(state.mode==="edit"){
    renderEditor();
  }
}

function buildMetrics(){
  const container=$("metrics");

  definitions.forEach(([key,label,min,max,step,unit])=>{
    const wrapper=document.createElement("div");
    wrapper.className="metric";

    const head=document.createElement("div");
    head.className="metric-head";

    const name=document.createElement("label");
    name.htmlFor="number-"+key;
    name.textContent=label;

    const field=document.createElement("div");
    field.className="number-field";

    const number=document.createElement("input");
    number.type="number";
    number.id="number-"+key;
    number.min=min;
    number.max=max;
    number.step=step;
    number.value=defaults[key];
    number.setAttribute("aria-label",label);

    const suffix=document.createElement("span");
    suffix.textContent=unit;

    field.append(number,suffix);

    const slider=document.createElement("input");
    slider.type="range";
    slider.id="slider-"+key;
    slider.min=min;
    slider.max=max;
    slider.step=step;
    slider.value=defaults[key];
    slider.setAttribute("aria-label",label);

    function update(value){
      if(!Number.isFinite(value))return;

      const adjusted=clamp(value,min,max);
      state.global[key]=adjusted;

      number.value=adjusted;
      slider.value=adjusted;

      renderAll();
    }

    slider.addEventListener("input",()=>{
      update(Number(slider.value));
    });

    number.addEventListener("change",()=>{
      update(Number(number.value));
    });

    head.append(name,field);
    wrapper.append(head,slider);
    container.appendChild(wrapper);
  });
}

function syncMetrics(){
  definitions.forEach(([key])=>{
    $("number-"+key).value=state.global[key];
    $("slider-"+key).value=state.global[key];
  });
}

function togglePanel(panel){
  const bench=$("workbench");
  const isLibrary=panel==="library";
  const className=isLibrary?"has-library":"has-transform";
  const button=$(isLibrary?"library-toggle":"transform-toggle");

  const open=!bench.classList.contains(className);

  bench.classList.toggle(className,open);
  button.classList.toggle("active",open);
  button.setAttribute("aria-expanded",String(open));

  requestAnimationFrame(buildBackground);
}

$("library-toggle").addEventListener("click",()=>{
  togglePanel("library");
});

$("transform-toggle").addEventListener("click",()=>{
  togglePanel("transform");
});

$("mix-button").addEventListener("click",()=>{
  state.fontMode="mix";
  regenerate(true);
  buildFontList();
  renderAll();
  switchMode("compose");
});

$("all-fonts-button").addEventListener("click",()=>{
  state.pool=new Set(fonts.map((_,i)=>i));
  state.fontMode="mix";

  regenerate(true);
  buildFontList();
  renderAll();
  switchMode("compose");
});

document.querySelectorAll(".category-button").forEach(button=>{
  button.addEventListener("click",()=>{
    state.category=button.dataset.category;

    document.querySelectorAll(".category-button").forEach(item=>{
      item.classList.toggle("active",item===button);
    });

    switchMode("glyph");
  });
});

$("type-input").addEventListener("input",event=>{
  state.text=event.target.value;
  regenerate();
  renderComposition();
});

$("back-button").addEventListener("click",()=>{
  if(state.mode==="edit"){
    switchMode(state.previousMode==="glyph"?"glyph":"compose");
  }else{
    switchMode("compose");
  }
});

$("back-edit").addEventListener("click",()=>{
  switchMode(state.previousMode==="glyph"?"glyph":"compose");
});

$("insert-glyph").addEventListener("click",()=>{
  if(!state.editGlyph)return;

  const glyph=state.editGlyph;
  const input=$("type-input");

  input.value+=glyph.char;
  state.text=input.value;

  regenerate();

  state.glyphs[state.glyphs.length-1]=glyph;
  state.displayText=state.glyphs.map(g=>g.char).join("");

  switchMode("compose");
  renderComposition();
  input.focus();
});

$("reset-button").addEventListener("click",()=>{
  state.global={...defaults};
  syncMetrics();
  renderAll();
});

const editLetter=$("edit-letter");
let drag=null;

editLetter.addEventListener("pointerdown",event=>{
  if(!state.editGlyph)return;

  event.preventDefault();
  editLetter.setPointerCapture(event.pointerId);

  drag={
    startX:event.clientX,
    startY:event.clientY,
    x:state.editGlyph.dx,
    y:state.editGlyph.dy
  };
});

editLetter.addEventListener("pointermove",event=>{
  if(!drag||!state.editGlyph)return;

  state.editGlyph.dx=
    Math.round(drag.x+event.clientX-drag.startX);

  state.editGlyph.dy=
    Math.round(drag.y+event.clientY-drag.startY);

  renderEditor();
});

function finishDrag(){
  drag=null;
  renderComposition();
}

editLetter.addEventListener("pointerup",finishDrag);
editLetter.addEventListener("pointercancel",finishDrag);

const canvas=$("canvas");
const ambient=$("ambient");
const ctx=ambient.getContext("2d");

const symbols=
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ"+
  "abcdefghijklmnopqrstuvwxyz"+
  "0123456789@#$%&*+-_/?!<>{}";

let background=[];
let canvasWidth=0;
let canvasHeight=0;
let pointer={x:-999,y:-999,visible:false};
let animationFrame=null;

function buildBackground(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvasWidth=rect.width;
  canvasHeight=rect.height;

  ambient.width=Math.max(1,Math.floor(canvasWidth*dpr));
  ambient.height=Math.max(1,Math.floor(canvasHeight*dpr));

  ctx.setTransform(dpr,0,0,dpr,0,0);

  background=[];

  for(let y=8;y<canvasHeight;y+=18){
    for(let x=8;x<canvasWidth;x+=18){
      background.push({
        x:x+rand(-3,3),
        y:y+rand(-3,3),
        char:pick(Array.from(symbols)),
        opacity:rand(.035,.17),
        bold:Math.random()<.12
      });
    }
  }

  drawBackground();
}

function drawBackground(){
  ctx.clearRect(0,0,canvasWidth,canvasHeight);
  ctx.textBaseline="middle";

  const radius=125;

  background.forEach(item=>{
    let moveX=0;
    let moveY=0;

    if(pointer.visible){
      const dx=item.x-pointer.x;
      const dy=item.y-pointer.y;
      const distance=Math.hypot(dx,dy);

      if(distance<radius&&distance>.001){
        const strength=Math.pow(1-distance/radius,2)*22;
        moveX=dx/distance*strength;
        moveY=dy/distance*strength;
      }
    }

    ctx.fillStyle=`rgba(225,226,232,${item.opacity})`;
    ctx.font=
      `${item.bold?700:400} 11px "IBM Plex Mono",monospace`;

    ctx.fillText(
      item.char,
      item.x+moveX,
      item.y+moveY
    );
  });
}

function queueBackground(){
  if(animationFrame!==null)return;

  animationFrame=requestAnimationFrame(()=>{
    animationFrame=null;
    drawBackground();
  });
}

canvas.addEventListener("pointermove",event=>{
  if(event.pointerType==="touch")return;

  const rect=canvas.getBoundingClientRect();

  pointer.x=event.clientX-rect.left;
  pointer.y=event.clientY-rect.top;
  pointer.visible=true;

  queueBackground();
});

canvas.addEventListener("pointerleave",()=>{
  pointer.visible=false;
  queueBackground();
});

const observer=new ResizeObserver(buildBackground);
observer.observe(canvas);

buildMetrics();
buildFontList();
regenerate(true);
renderComposition();
renderGlyphGrid();
buildBackground();

document.fonts.ready.then(()=>{
  renderAll();
  drawBackground();
});
</script>

</body>
