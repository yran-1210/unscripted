
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type Index — Unscripted</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=EB+Garamond:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;700;900&family=Libre+Baskerville:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700;900&family=Raleway:wght@300;700;900&family=Roboto:wght@400;700;900&family=Source+Sans+3:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #050505;
  --fg: #f1eee8;
  --muted: #777;
  --line: #292929;
  --hover: #161616;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: Arial, sans-serif;
}

button,
a {
  font: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 4vw;
  border-bottom: 1px solid var(--line);
}

.brand {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.15em;
}

.back {
  font-size: 12px;
  color: var(--muted);
  transition: color 0.2s;
}

.back:hover {
  color: var(--fg);
}

.layout {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  min-height: calc(100vh - 65px);
}

.sidebar {
  border-right: 1px solid var(--line);
  padding: 40px 0;
}

.label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.sidebar-heading {
  padding: 0 25px 25px;
}

.font-list {
  display: flex;
  flex-direction: column;
}

.font-item {
  width: 100%;
  padding: 18px 25px;
  display: grid;
  grid-template-columns: 30px 1fr 22px;
  align-items: center;
  gap: 10px;
  background: transparent;
  border: 0;
  border-top: 1px solid var(--line);
  color: var(--fg);
  text-align: left;
  cursor: pointer;
  transition: background 0.2s;
}

.font-item:last-child {
  border-bottom: 1px solid var(--line);
}

.font-item:hover,
.font-item.active {
  background: var(--hover);
}

.font-number {
  color: var(--muted);
  font-size: 11px;
}

.font-name {
  font-size: 15px;
}

.font-arrow {
  color: var(--muted);
  text-align: right;
  font-size: 16px;
}

.font-item.active .font-arrow {
  color: var(--fg);
}

.specimen {
  min-width: 0;
  padding: 45px 5vw 100px;
}

.specimen-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

#font-counter {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.12em;
}

#font-title {
  margin: 65px 0 10px;
  font-size: clamp(36px, 5vw, 78px);
  font-weight: 400;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.font-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 30px;
  margin-top: 22px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.hero-sample {
  min-height: 240px;
  display: flex;
  align-items: center;
  margin: 40px 0 65px;
  overflow: hidden;
}

#hero-letters {
  font-size: clamp(100px, 15vw, 240px);
  line-height: 1.15;
  letter-spacing: -0.06em;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.weight-button {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 3px;
  padding: 9px 13px;
  font-size: 11px;
  cursor: pointer;
}

.weight-button.active {
  color: var(--bg);
  background: var(--fg);
  border-color: var(--fg);
}

.specimen-section {
  padding: 35px 0 45px;
  border-top: 1px solid var(--line);
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 30px;
}

.section-heading span:last-child {
  font-size: 11px;
  color: var(--muted);
}

.sample {
  margin: 0;
  font-size: clamp(25px, 3.3vw, 54px);
  line-height: 1.5;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.sample.small {
  font-size: clamp(19px, 2.2vw, 35px);
  line-height: 1.8;
}

.sample.sentence {
  font-size: clamp(28px, 3.8vw, 60px);
  line-height: 1.4;
}

#font-description {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
  max-width: 650px;
}

@media (max-width: 800px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 25px 0 0;
  }

  .font-list {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    padding: 0 15px 15px;
  }

  .font-item {
    width: auto;
    min-width: 150px;
    grid-template-columns: 1fr;
    gap: 8px;
    border: 1px solid var(--line);
    margin-right: 8px;
    padding: 14px;
  }

  .font-item:last-child {
    border: 1px solid var(--line);
  }

  .font-arrow {
    display: none;
  }

  .specimen {
    padding: 35px 6vw 70px;
  }

  #font-title {
    margin-top: 40px;
  }

  .hero-sample {
    min-height: 170px;
    margin: 30px 0 45px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">UNSCRIPTED / TYPE INDEX</div>
  <a class="back" href="./index.html">Back to Unscripted ↗</a>
</header>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-heading">
      <div class="label">Typeface Library / 001—010</div>
    </div>
    <nav class="font-list" id="font-list" aria-label="Typeface index"></nav>
  </aside>

  <main class="specimen">

    <div class="specimen-top">
      <span class="label">Typeface Specimen</span>
      <span id="font-counter">01 / 10</span>
    </div>

    <h1 id="font-title"></h1>

    <div class="font-meta">
      <span id="font-reference"></span>
      <span id="font-fallback"></span>
    </div>

    <div class="hero-sample">
      <div id="hero-letters">Aa</div>
    </div>

    <div class="section-heading">
      <span class="label">Font Weight</span>
      <div class="controls" id="weight-controls"></div>
    </div>

    <section class="specimen-section">
      <div class="section-heading">
        <span class="label">01 / Uppercase</span>
        <span>A–Z</span>
      </div>
      <p class="sample" id="uppercase"></p>
    </section>

    <section class="specimen-section">
      <div class="section-heading">
        <span class="label">02 / Lowercase</span>
        <span>a–z</span>
      </div>
      <p class="sample" id="lowercase"></p>
    </section>

    <section class="specimen-section">
      <div class="section-heading">
        <span class="label">03 / Numerals</span>
        <span>0–9</span>
      </div>
      <p class="sample" id="numerals"></p>
    </section>

    <section class="specimen-section">
      <div class="section-heading">
        <span class="label">04 / Punctuation & Symbols</span>
        <span>ASCII</span>
      </div>
      <p class="sample small" id="punctuation"></p>
    </section>

    <section class="specimen-section">
      <div class="section-heading">
        <span class="label">05 / Additional Symbols</span>
        <span>Typography</span>
      </div>
      <p class="sample small" id="additional"></p>
    </section>

    <section class="specimen-section">
      <div class="section-heading">
        <span class="label">06 / Sample Sentence</span>
        <span>English</span>
      </div>
      <p class="sample sentence" id="sentence"></p>
    </section>

    <section class="specimen-section">
      <div class="section-heading">
        <span class="label">07 / Font Information</span>
      </div>
      <p id="font-description"></p>
    </section>

  </main>
</div>

<script>
const fonts = [
  {
    name: "Aptos",
    reference: "Microsoft Word",
    fallback: "Inter",
    family: '"Aptos", "Inter", Arial, sans-serif',
    weights: [400, 700, 900],
    description: "A contemporary sans-serif typeface associated with Microsoft Office. Its clean and balanced structure makes it suitable for general text and modern typography."
  },
  {
    name: "Arial",
    reference: "Microsoft Word",
    fallback: "Roboto",
    family: '"Arial", "Roboto", sans-serif',
    weights: [400, 700, 900],
    description: "A widely used sans-serif typeface with a neutral visual structure. Its straightforward letterforms provide a useful contrast to more expressive serif and geometric fonts."
  },
  {
    name: "Times New Roman",
    reference: "Microsoft Word",
    fallback: "Libre Baskerville",
    family: '"Times New Roman", "Libre Baskerville", serif',
    weights: [400, 700],
    description: "A traditional serif typeface commonly associated with formal documents, publishing, and editorial typography. It features contrasting strokes and compact letterforms."
  },
  {
    name: "Georgia",
    reference: "Microsoft Word",
    fallback: "Merriweather",
    family: '"Georgia", "Merriweather", serif',
    weights: [400, 700],
    description: "A serif typeface designed for screen readability. Its larger proportions and distinctive serifs produce recognizable letterforms at different sizes."
  },
  {
    name: "Garamond",
    reference: "Publishing",
    fallback: "EB Garamond",
    family: '"Garamond", "EB Garamond", serif',
    weights: [400, 700],
    description: "A family of classical serif designs associated with book typography. Its humanist proportions and delicate stroke variation create an elegant, literary appearance."
  },
  {
    name: "Helvetica Neue",
    reference: "Graphic Design",
    fallback: "Raleway",
    family: '"Helvetica Neue", "Raleway", sans-serif',
    weights: [300, 700, 900],
    description: "A neo-grotesque sans-serif design known for restrained letterforms and a clean visual rhythm. The web fallback provides a different, more geometric interpretation."
  },
  {
    name: "Futura",
    reference: "Graphic Design",
    fallback: "Montserrat",
    family: '"Futura", "Montserrat", sans-serif',
    weights: [400, 700, 900],
    description: "A geometric sans-serif typeface built around simplified shapes and strong proportions. It is particularly recognizable in uppercase and display typography."
  },
  {
    name: "Myriad Pro",
    reference: "Adobe / InDesign",
    fallback: "Source Sans 3",
    family: '"Myriad Pro", "Source Sans 3", sans-serif',
    weights: [400, 700, 900],
    description: "A humanist sans-serif typeface with open and readable forms. It offers a softer alternative to geometric and neo-grotesque sans-serif styles."
  },
  {
    name: "Minion Pro",
    reference: "Adobe / InDesign",
    fallback: "Crimson Pro",
    family: '"Minion Pro", "Crimson Pro", serif',
    weights: [400, 700],
    description: "A serif typeface associated with book and editorial design. Its classical proportions and detailed construction are suited to literary and long-form typography."
  },
  {
    name: "Courier New",
    reference: "Microsoft Word",
    fallback: "IBM Plex Mono",
    family: '"Courier New", "IBM Plex Mono", monospace',
    weights: [400, 700],
    description: "A monospaced typeface in which characters occupy equal horizontal space. Its typewriter-like appearance is useful for code, numbers, and structured text."
  }
];

const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lowercase = "abcdefghijklmnopqrstuvwxyz";
const numerals = "0123456789";

const punctuation =
  "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";

const additional =
  "“ ” ‘ ’ — – … • · © ® ™ § ¶ ° ± × ÷ € £ ¥";

const sentence =
  "The quick brown fox jumps over the lazy dog.";

const fontList = document.getElementById("font-list");
const weightControls = document.getElementById("weight-controls");

const fontTitle = document.getElementById("font-title");
const fontCounter = document.getElementById("font-counter");
const fontReference = document.getElementById("font-reference");
const fontFallback = document.getElementById("font-fallback");
const fontDescription = document.getElementById("font-description");

const specimenElements = [
  document.getElementById("hero-letters"),
  document.getElementById("uppercase"),
  document.getElementById("lowercase"),
  document.getElementById("numerals"),
  document.getElementById("punctuation"),
  document.getElementById("additional"),
  document.getElementById("sentence")
];

let currentFont = 0;
let currentWeight = 400;

document.getElementById("uppercase").textContent = uppercase;
document.getElementById("lowercase").textContent = lowercase;
document.getElementById("numerals").textContent = numerals;
document.getElementById("punctuation").textContent = punctuation;
document.getElementById("additional").textContent = additional;
document.getElementById("sentence").textContent = sentence;

function buildFontList() {
  fontList.replaceChildren();

  fonts.forEach((font, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "font-item";
    button.dataset.index = index;

    const number = document.createElement("span");
    number.className = "font-number";
    number.textContent = String(index + 1).padStart(2, "0");

    const name = document.createElement("span");
    name.className = "font-name";
    name.textContent = font.name;

    const arrow = document.createElement("span");
    arrow.className = "font-arrow";
    arrow.textContent = "↗";

    button.append(number, name, arrow);

    button.addEventListener("click", () => {
      selectFont(index);
    });

    fontList.appendChild(button);
  });
}

function setWeight(weight) {
  currentWeight = weight;

  specimenElements.forEach(element => {
    element.style.fontWeight = weight;
  });

  document.querySelectorAll(".weight-button").forEach(button => {
    const active = Number(button.dataset.weight) === weight;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

function buildWeightControls(font) {
  weightControls.replaceChildren();

  font.weights.forEach(weight => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "weight-button";
    button.dataset.weight = weight;

    if (weight === 300) button.textContent = "Light";
    if (weight === 400) button.textContent = "Regular";
    if (weight === 700) button.textContent = "Bold";
    if (weight === 900) button.textContent = "Black";

    button.addEventListener("click", () => {
      setWeight(weight);
    });

    weightControls.appendChild(button);
  });
}

function selectFont(index) {
  currentFont = index;

  const font = fonts[index];

  fontTitle.textContent = font.name;

  fontCounter.textContent =
    `${String(index + 1).padStart(2, "0")} / 10`;

  fontReference.textContent =
    `Reference: ${font.reference}`;

  fontFallback.textContent =
    `Web fallback: ${font.fallback}`;

  fontDescription.textContent = font.description;

  specimenElements.forEach(element => {
    element.style.fontFamily = font.family;
  });

  document.querySelectorAll(".font-item").forEach(button => {
    const active = Number(button.dataset.index) === index;
    button.classList.toggle("active", active);
    button.setAttribute("aria-current", active ? "true" : "false");
  });

  buildWeightControls(font);
  setWeight(font.weights.includes(400) ? 400 : font.weights[0]);

  history.replaceState(null, "", `#font-${index + 1}`);
}

buildFontList();

const initialIndex = Number(
  window.location.hash.replace("#font-", "")
);

selectFont(
  initialIndex >= 1 && initialIndex <= 10
    ? initialIndex - 1
    : 0
);

window.addEventListener("hashchange", () => {
  const index = Number(
    window.location.hash.replace("#font-", "")
  );

  if (index >= 1 && index <= 10) {
    if (index - 1 !== currentFont) {
      selectFont(index - 1);
    }
  }
});
</script>

</body>
</html>
