
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unscripted</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --background: #050505;
  --foreground: #f1eee8;
  --input-background: #101010;
  --input-border: rgba(255,255,255,0.18);
  --placeholder: #777;
  --ambient-color: rgba(255,255,255,0.23);
  --spotlight-center: rgba(255,255,255,0.65);
  --spotlight-edge: rgba(255,255,255,0.18);
}

body.light {
  --background: #fafafa;
  --foreground: #080808;
  --input-background: #f4f4f4;
  --input-border: rgba(0,0,0,0.16);
  --placeholder: #888;
  --ambient-color: rgba(0,0,0,0.21);
  --spotlight-center: rgba(0,0,0,0.65);
  --spotlight-edge: rgba(0,0,0,0.18);
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  background: var(--background);
  color: var(--foreground);
  font-family: Arial, sans-serif;
  transition: background 350ms ease, color 350ms ease;
}

#ambient {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.ambient-character {
  position: absolute;
  font-family: "Courier New", monospace;
  font-size: 12px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: 0.04em;
  color: var(--ambient-color);
  white-space: nowrap;
  user-select: none;
  will-change: transform;
  animation: floatCode 25s ease-in-out infinite alternate;
  transition: color 350ms ease;
}

@keyframes floatCode {
  0% {
    transform: translate3d(0, 0, 0);
  }
  100% {
    transform: translate3d(
      var(--drift-x),
      var(--drift-y),
      0
    );
  }
}

main {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: 6vh 6vw 7vh;
}

#stage {
  flex: 1;
  width: 100%;
  min-height: 0;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding-top: 3vh;
  overflow: auto;
}

#composition {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  align-content: flex-start;
  justify-content: flex-start;
  font-size: clamp(12px, 1.25vw, 22px);
}

.character {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  height: 1.5em;
}

.shape {
  display: inline-block;
  line-height: 1;
  white-space: pre;
  transform-origin: 50% 80%;
  user-select: none;
  animation: appear 180ms ease-out both;
}

.word-space {
  width: 0.35em;
}

.line-break {
  flex-basis: 100%;
  height: 0.25em;
}

#input-area {
  width: min(520px, 100%);
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

#message {
  display: block;
  width: 100%;
  height: 54px;
  padding: 15px 18px;
  background: var(--input-background);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  color: var(--foreground);
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 22px;
  resize: none;
  outline: none;
  overflow-y: auto;
  transition:
    background 350ms ease,
    border-color 350ms ease,
    color 350ms ease;
}

#message::placeholder {
  color: var(--placeholder);
}

#message:focus {
  border-color: var(--foreground);
}

#spotlight {
  position: fixed;
  top: 0;
  left: 0;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(
    circle,
    var(--spotlight-center) 0%,
    var(--spotlight-edge) 32%,
    transparent 72%
  );
  filter: blur(13px);
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 180ms ease;
}

@media (hover: hover) and (pointer: fine) {
  body {
    cursor: none;
  }

  #message {
    cursor: text;
  }
}

@media (pointer: coarse) {
  #spotlight {
    display: none;
  }
}

@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  main {
    padding: 5vh 5vw 6vh;
  }

  #composition {
    font-size: 12px;
  }

  #input-area {
    width: 100%;
  }

  #message {
    height: 50px;
    padding: 13px 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .shape,
  .ambient-character {
    animation: none;
  }

  body,
  #message,
  #spotlight {
    transition: none;
  }
}
</style>
</head>

<body>

<div id="ambient" aria-hidden="true"></div>
<div id="spotlight" aria-hidden="true"></div>

<main>
  <section id="stage">
    <div
      id="composition"
      aria-label="Generated typography"
    ></div>
  </section>

  <div id="input-area">
    <textarea
      id="message"
      rows="1"
      placeholder="Type something..."
      aria-label="Type something"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    ></textarea>
  </div>
</main>

<script>
const input = document.getElementById("message");
const composition = document.getElementById("composition");
const spotlight = document.getElementById("spotlight");
const ambient = document.getElementById("ambient");

const context = document
  .createElement("canvas")
  .getContext("2d");

const fonts = [
  { family: "Arial, sans-serif", weight: 400 },
  { family: "Arial, sans-serif", weight: 900 },
  { family: "Helvetica, Arial, sans-serif", weight: 300 },
  { family: "Georgia, serif", weight: 400 },
  { family: "Georgia, serif", weight: 700 },
  { family: "'Times New Roman', serif", weight: 400 },
  { family: "'Courier New', monospace", weight: 400 },
  { family: "'Courier New', monospace", weight: 700 }
];

const beats = [
  { size: 0.90, width: 1.05, height: 0.95 },
  { size: 1.15, width: 0.75, height: 1.35 },
  { size: 0.85, width: 1.25, height: 0.85 },
  { size: 1.25, width: 0.95, height: 1.15 }
];

const ambientSymbols =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
  "abcdefghijklmnopqrstuvwxyz" +
  "0123456789" +
  "@#$%&*+-_=/?!<>[]{}";

const random = (min, max) =>
  min + Math.random() * (max - min);

const pick = array =>
  array[Math.floor(Math.random() * array.length)];

let previousText = [];
let characters = [];

function createAmbient() {
  ambient.replaceChildren();

  const fragment = document.createDocumentFragment();

  const columns = window.innerWidth < 650 ? 7 : 16;
  const rows = window.innerWidth < 650 ? 17 : 11;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < columns; x++) {
      const element = document.createElement("span");

      const length = Math.random() < 0.15
        ? 1
        : Math.floor(random(4, 15));

      let code = "";

      for (let i = 0; i < length; i++) {
        code += pick(ambientSymbols);
      }

      element.className = "ambient-character";
      element.textContent = code;

      element.style.left =
        `${((x + random(0.1, 0.85)) / columns) * 100}%`;

      element.style.top =
        `${((y + random(0.1, 0.85)) / rows) * 100}%`;

      element.style.opacity = random(0.45, 0.90);

      element.style.setProperty(
        "--drift-x",
        `${random(-22, 22)}px`
      );

      element.style.setProperty(
        "--drift-y",
        `${random(-20, 20)}px`
      );

      element.style.animationDuration =
        `${random(16, 38)}s`;

      element.style.animationDelay =
        `${random(-30, 0)}s`;

      fragment.appendChild(element);
    }
  }

  ambient.appendChild(fragment);
}

function createCharacter(letter, index) {
  const element = document.createElement("span");

  if (letter === "\n") {
    element.className = "line-break";
    return element;
  }

  if (/\s/u.test(letter)) {
    element.className = "character word-space";
    return element;
  }

  const beat = beats[index % beats.length];
  const font = pick(fonts);

  const size = beat.size * random(0.85, 1.15);
  const scaleX = beat.width * random(0.75, 1.25);
  const scaleY = beat.height * random(0.85, 1.30);

  const rotation = random(-4, 4);
  const rise = random(-0.08, 0.08);
  const italic = Math.random() < 0.25;

  const shape = document.createElement("span");

  element.className = "character";
  shape.className = "shape";
  shape.textContent = letter;

  shape.style.fontFamily = font.family;
  shape.style.fontWeight = font.weight;
  shape.style.fontStyle = italic ? "italic" : "normal";
  shape.style.fontSize = `${size}em`;

  shape.style.transform = `
    translateY(${rise}em)
    rotate(${rotation}deg)
    scale(${scaleX}, ${scaleY})
  `;

  element.appendChild(shape);

  context.font =
    `${italic ? "italic" : "normal"} ` +
    `${font.weight} 100px ${font.family}`;

  const measured = context.measureText(letter).width;

  element.style.width =
    `${Math.max(0.18, measured / 100 * size * scaleX + 0.05)}em`;

  return element;
}

function updateTypography(text) {
  const nextText = Array.from(text || "Hello World");

  let prefix = 0;
  let suffix = 0;

  while (
    prefix < previousText.length &&
    prefix < nextText.length &&
    previousText[prefix] === nextText[prefix]
  ) {
    prefix++;
  }

  while (
    suffix < previousText.length - prefix &&
    suffix < nextText.length - prefix &&
    previousText[previousText.length - 1 - suffix] ===
      nextText[nextText.length - 1 - suffix]
  ) {
    suffix++;
  }

  const start = characters.slice(0, prefix);

  const middle = nextText
    .slice(prefix, nextText.length - suffix)
    .map((letter, i) =>
      createCharacter(letter, prefix + i)
    );

  const end = suffix
    ? characters.slice(-suffix)
    : [];

  characters = [...start, ...middle, ...end];
  previousText = nextText;

  composition.replaceChildren(...characters);
}

input.addEventListener("input", () => {
  updateTypography(input.value);
});

document.addEventListener("pointermove", event => {
  if (
    event.pointerType !== "mouse" &&
    event.pointerType !== "pen"
  ) {
    return;
  }

  spotlight.style.left = `${event.clientX}px`;
  spotlight.style.top = `${event.clientY}px`;
  spotlight.style.opacity = "1";
});

document.addEventListener("pointerleave", () => {
  spotlight.style.opacity = "0";
});

window.addEventListener("blur", () => {
  spotlight.style.opacity = "0";
});

document.addEventListener("click", event => {
  if (event.target.closest("#input-area")) {
    return;
  }

  document.body.classList.toggle("light");
});

createAmbient();
updateTypography("Hello World");
</script>

</body>
</html>
