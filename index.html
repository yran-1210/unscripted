
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Unscripted</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&family=EB+Garamond:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;700;900&family=Libre+Baskerville:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700;900&family=Raleway:wght@300;700;900&family=Roboto:wght@400;700;900&family=Source+Sans+3:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

:root {
  --background: #050505;
  --foreground: #f1eee8;
  --input-background: #101010;
  --input-border: rgba(255,255,255,0.18);
  --placeholder: #777;
  --spotlight-center: rgba(255,255,255,0.65);
  --spotlight-edge: rgba(255,255,255,0.18);
}

body.light {
  --background: #fafafa;
  --foreground: #080808;
  --input-background: #f4f4f4;
  --input-border: rgba(0,0,0,0.16);
  --placeholder: #888;
  --spotlight-center: rgba(0,0,0,0.65);
  --spotlight-edge: rgba(0,0,0,0.18);
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  background: var(--background);
  color: var(--foreground);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition:
    background 350ms ease,
    color 350ms ease;
}

#ambient {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 400ms ease,
    visibility 400ms ease;
}

body.light #ambient {
  opacity: 1;
  visibility: visible;
}

.ambient-character {
  position: absolute;
  display: block;
  font-family: "IBM Plex Mono", "Courier New", monospace;
  font-size: 12px;
  font-weight: 400;
  line-height: 1;
  white-space: pre;
  user-select: none;
  color: #000;
  pointer-events: none;
  will-change: transform;
  transition:
    transform 450ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

main {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: 6vh 6vw 7vh;
}

#stage {
  flex: 1;
  width: 100%;
  min-height: 0;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding-top: 3vh;
  overflow: auto;
}

#composition {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  align-content: flex-start;
  justify-content: flex-start;
  gap: 0;
  font-size: clamp(12px, 1.25vw, 22px);
}

.character {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  height: 1.5em;
}

.shape {
  display: inline-block;
  line-height: 1;
  white-space: pre;
  transform-origin: 50% 80%;
  user-select: none;
  animation: appear 180ms ease-out both;
}

.word-space {
  width: 0.35em;
}

.line-break {
  flex-basis: 100%;
  height: 0.25em;
}

#input-area {
  width: min(520px, 100%);
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

#message {
  display: block;
  width: 100%;
  height: 54px;
  padding: 15px 18px;
  background: var(--input-background);
  border: 1px solid var(--input-border);
  border-radius: 4px;
  color: var(--foreground);
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 22px;
  resize: none;
  outline: none;
  overflow-y: auto;
  transition:
    background 350ms ease,
    border-color 350ms ease,
    color 350ms ease;
}

#message::placeholder {
  color: var(--placeholder);
}

#message:focus {
  border-color: var(--foreground);
}

#spotlight {
  position: fixed;
  top: 0;
  left: 0;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(
    circle,
    var(--spotlight-center) 0%,
    var(--spotlight-edge) 32%,
    transparent 72%
  );
  filter: blur(13px);
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 180ms ease;
}

@keyframes appear {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@media (hover: hover) and (pointer: fine) {
  body {
    cursor: none;
  }

  #message {
    cursor: text;
  }
}

@media (pointer: coarse) {
  #spotlight {
    display: none;
  }
}

@media (max-width: 600px) {
  main {
    padding: 5vh 5vw 6vh;
  }

  #composition {
    font-size: 12px;
  }

  #input-area {
    width: 100%;
  }

  #message {
    height: 50px;
    padding: 13px 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .shape {
    animation: none;
  }

  .ambient-character,
  body,
  #message,
  #spotlight,
  #ambient {
    transition: none;
  }
}
</style>
</head>

<body>

<div id="ambient" aria-hidden="true"></div>
<div id="spotlight" aria-hidden="true"></div>

<main>
  <section id="stage">
    <div
      id="composition"
      aria-label="Generated typography"
      aria-live="off"
    ></div>
  </section>

  <div id="input-area">
    <textarea
      id="message"
      rows="1"
      placeholder="Type something..."
      aria-label="Type something"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    ></textarea>
  </div>
</main>

<script>
const input = document.getElementById("message");
const composition = document.getElementById("composition");
const spotlight = document.getElementById("spotlight");
const ambient = document.getElementById("ambient");

const context = document
  .createElement("canvas")
  .getContext("2d");

const fonts = [
  {
    name: "Aptos",
    family: '"Aptos", "Inter", Arial, sans-serif',
    weights: [400, 700, 900]
  },
  {
    name: "Arial",
    family: '"Arial", "Roboto", sans-serif',
    weights: [400, 700, 900]
  },
  {
    name: "Times New Roman",
    family: '"Times New Roman", "Libre Baskerville", serif',
    weights: [400, 700]
  },
  {
    name: "Georgia",
    family: '"Georgia", "Merriweather", serif',
    weights: [400, 700]
  },
  {
    name: "Garamond",
    family: '"Garamond", "EB Garamond", serif',
    weights: [400, 700]
  },
  {
    name: "Helvetica Neue",
    family: '"Helvetica Neue", "Raleway", sans-serif',
    weights: [300, 700, 900]
  },
  {
    name: "Futura",
    family: '"Futura", "Montserrat", sans-serif',
    weights: [400, 700, 900]
  },
  {
    name: "Myriad Pro",
    family: '"Myriad Pro", "Source Sans 3", sans-serif',
    weights: [400, 700, 900]
  },
  {
    name: "Minion Pro",
    family: '"Minion Pro", "Crimson Pro", serif',
    weights: [400, 700]
  },
  {
    name: "Courier New",
    family: '"Courier New", "IBM Plex Mono", monospace',
    weights: [400, 700]
  }
];

const beats = [
  {
    size: 0.90,
    width: 1.05,
    height: 0.95
  },
  {
    size: 1.15,
    width: 0.75,
    height: 1.35
  },
  {
    size: 0.85,
    width: 1.25,
    height: 0.85
  },
  {
    size: 1.25,
    width: 0.95,
    height: 1.15
  }
];

const ambientSymbols =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
  "abcdefghijklmnopqrstuvwxyz" +
  "0123456789" +
  "@#$%&*+-_=/?!<>[]{}()";

const ambientSettings = {
  fontSize: 12,
  spacingX: 22,
  spacingY: 22,
  jitter: 4,
  interactionRadius: 115,
  interactionStrength: 19,
  minimumOpacity: 0.035,
  maximumOpacity: 0.23
};

const random = (min, max) =>
  min + Math.random() * (max - min);

const pick = array =>
  array[Math.floor(Math.random() * array.length)];

const clamp = (value, min, max) =>
  Math.max(min, Math.min(max, value));

let previousText = [];
let characters = [];

let ambientGrid = [];
let ambientColumns = 0;
let ambientRows = 0;

let activeAmbient = new Set();

let pointerX = -1000;
let pointerY = -1000;
let pointerFrame = null;

function createAmbient() {
  ambient.replaceChildren();

  ambientGrid = [];
  activeAmbient.clear();

  const width = window.innerWidth;
  const height = window.innerHeight;

  const spacingX = ambientSettings.spacingX;
  const spacingY = ambientSettings.spacingY;

  ambientColumns = Math.ceil(width / spacingX) + 1;
  ambientRows = Math.ceil(height / spacingY) + 1;

  const fragment = document.createDocumentFragment();

  for (let row = 0; row < ambientRows; row++) {
    for (let col = 0; col < ambientColumns; col++) {
      const element = document.createElement("span");

      const x =
        col * spacingX +
        random(-ambientSettings.jitter, ambientSettings.jitter);

      const y =
        row * spacingY +
        random(-ambientSettings.jitter, ambientSettings.jitter);

      const symbol = pick(Array.from(ambientSymbols));

      const opacity = random(
        ambientSettings.minimumOpacity,
        ambientSettings.maximumOpacity
      );

      element.className = "ambient-character";
      element.textContent = symbol;

      element.style.left = `${x}px`;
      element.style.top = `${y}px`;
      element.style.opacity = opacity;

      element.style.fontSize =
        `${ambientSettings.fontSize}px`;

      element.style.fontWeight =
        Math.random() < 0.16 ? "700" : "400";

      fragment.appendChild(element);

      ambientGrid.push({
        element,
        x,
        y
      });
    }
  }

  ambient.appendChild(fragment);
}

function resetAmbient() {
  for (const index of activeAmbient) {
    const item = ambientGrid[index];

    if (item) {
      item.element.style.transform = "translate3d(0,0,0)";
    }
  }

  activeAmbient.clear();
}

function updateAmbientInteraction() {
  pointerFrame = null;

  if (!document.body.classList.contains("light")) {
    resetAmbient();
    return;
  }

  const radius = ambientSettings.interactionRadius;
  const strength = ambientSettings.interactionStrength;

  const spacingX = ambientSettings.spacingX;
  const spacingY = ambientSettings.spacingY;

  const centerCol = Math.floor(pointerX / spacingX);
  const centerRow = Math.floor(pointerY / spacingY);

  const rangeX = Math.ceil(radius / spacingX) + 1;
  const rangeY = Math.ceil(radius / spacingY) + 1;

  const nextActive = new Set();

  const minRow = Math.max(0, centerRow - rangeY);
  const maxRow = Math.min(
    ambientRows - 1,
    centerRow + rangeY
  );

  const minCol = Math.max(0, centerCol - rangeX);
  const maxCol = Math.min(
    ambientColumns - 1,
    centerCol + rangeX
  );

  for (let row = minRow; row <= maxRow; row++) {
    for (let col = minCol; col <= maxCol; col++) {
      const index = row * ambientColumns + col;
      const item = ambientGrid[index];

      if (!item) continue;

      const dx = item.x - pointerX;
      const dy = item.y - pointerY;

      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance >= radius) continue;

      const falloff = Math.pow(
        1 - distance / radius,
        2
      );

      const directionX =
        distance > 0.001 ? dx / distance : 0;

      const directionY =
        distance > 0.001 ? dy / distance : 0;

      const movement = strength * falloff;

      const offsetX = directionX * movement;
      const offsetY = directionY * movement;

      item.element.style.transform = `
        translate3d(
          ${offsetX}px,
          ${offsetY}px,
          0
        )
      `;

      nextActive.add(index);
    }
  }

  for (const index of activeAmbient) {
    if (!nextActive.has(index)) {
      const item = ambientGrid[index];

      if (item) {
        item.element.style.transform =
          "translate3d(0,0,0)";
      }
    }
  }

  activeAmbient = nextActive;
}

function createCharacter(letter, index) {
  const element = document.createElement("span");

  if (letter === "\n") {
    element.className = "line-break";
    return element;
  }

  if (/\s/u.test(letter)) {
    element.className = "character word-space";
    return element;
  }

  const beat = beats[index % beats.length];

  const font = pick(fonts);
  const weight = pick(font.weights);

  const size =
    beat.size * random(0.85, 1.15);

  const scaleX =
    beat.width * random(0.75, 1.25);

  const scaleY =
    beat.height * random(0.85, 1.30);

  const rotation = random(-4, 4);
  const rise = random(-0.08, 0.08);
  const italic = Math.random() < 0.25;

  const shape = document.createElement("span");

  element.className = "character";
  shape.className = "shape";
  shape.textContent = letter;

  shape.style.fontFamily = font.family;
  shape.style.fontWeight = weight;
  shape.style.fontStyle =
    italic ? "italic" : "normal";

  shape.style.fontSize = `${size}em`;

  shape.style.transform = `
    translateY(${rise}em)
    rotate(${rotation}deg)
    scale(${scaleX}, ${scaleY})
  `;

  element.appendChild(shape);

  context.font =
    `${italic ? "italic" : "normal"} ` +
    `${weight} 100px ${font.family}`;

  const measured =
    context.measureText(letter).width;

  const characterWidth =
    measured / 100 * size * scaleX;

  element.style.width =
    `${Math.max(0.18, characterWidth + 0.05)}em`;

  return element;
}

function updateTypography(text) {
  const nextText = Array.from(text || "Hello World");

  let prefix = 0;
  let suffix = 0;

  while (
    prefix < previousText.length &&
    prefix < nextText.length &&
    previousText[prefix] === nextText[prefix]
  ) {
    prefix++;
  }

  while (
    suffix < previousText.length - prefix &&
    suffix < nextText.length - prefix &&
    previousText[previousText.length - 1 - suffix] ===
      nextText[nextText.length - 1 - suffix]
  ) {
    suffix++;
  }

  const start = characters.slice(0, prefix);

  const middle = nextText
    .slice(prefix, nextText.length - suffix)
    .map((letter, index) =>
      createCharacter(letter, prefix + index)
    );

  const end = suffix
    ? characters.slice(-suffix)
    : [];

  characters = [
    ...start,
    ...middle,
    ...end
  ];

  previousText = nextText;

  composition.replaceChildren(...characters);
}

input.addEventListener("input", () => {
  updateTypography(input.value);
});

document.addEventListener("pointermove", event => {
  if (
    event.pointerType !== "mouse" &&
    event.pointerType !== "pen"
  ) {
    return;
  }

  pointerX = event.clientX;
  pointerY = event.clientY;

  spotlight.style.left = `${pointerX}px`;
  spotlight.style.top = `${pointerY}px`;
  spotlight.style.opacity = "1";

  if (pointerFrame === null) {
    pointerFrame = requestAnimationFrame(
      updateAmbientInteraction
    );
  }
});

document.addEventListener("pointerleave", () => {
  spotlight.style.opacity = "0";

  pointerX = -1000;
  pointerY = -1000;

  resetAmbient();
});

window.addEventListener("blur", () => {
  spotlight.style.opacity = "0";
  resetAmbient();
});

document.addEventListener("click", event => {
  if (event.target.closest("#input-area")) {
    return;
  }

  document.body.classList.toggle("light");

  if (!document.body.classList.contains("light")) {
    resetAmbient();
  } else {
    if (pointerFrame === null) {
      pointerFrame = requestAnimationFrame(
        updateAmbientInteraction
      );
    }
  }
});

let resizeTimer = null;

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {
    createAmbient();
  }, 180);
});

createAmbient();
updateTypography("Hello World");

document.fonts.ready.then(() => {
  characters = [];
  previousText = [];

  updateTypography(input.value || "Hello World");
});
</script>

</body>
</html>
